name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML routes and assets
        run: node scripts/check-site.mjs
      - name: Validate browser scripts
        run: |
          node --check script.js
          node --check attico.js
          node --check private-visit.js
          node --check api/contact.js
